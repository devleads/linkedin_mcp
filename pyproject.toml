[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "LinkedIn MCP Server for browser automation with stealth capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29,<2",  # v2.0.0 is a breaking major release; stay on v1.x until migration
    "patchright==1.61.2",
    "httpx==0.28.1",
    "aiohttp==3.14.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "cryptography==50.0.0",
    "pyotp==2.10.0",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "psycopg==3.3.4",
    "alembic==1.18.5",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
